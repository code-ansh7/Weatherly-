name: weatherly
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_dotenv: ^6.0.1
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - .env
    - assets/icons/weatherly_logo2.png


flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
    image_path: "assets/icons/weatherly_logo2.png"
    background_color: "#061B33"
    theme_color: "#0D4773"
  image_path: "assets/icons/weatherly_logo2.png"
  min_sdk_android: 21